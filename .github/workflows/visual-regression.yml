name: Hradník visual regression

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Run visual capture
        run: npm run test:visual

      - name: Upload rendered screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hradnik-visual-render
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
