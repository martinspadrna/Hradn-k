name: Generate Hradník PNG icons

on:
  push:
    branches: [main]
    paths:
      - 'public/hradnik-app-icon.svg'

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG converter
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Generate iOS icons
        run: |
          rsvg-convert -w 180 -h 180 public/hradnik-app-icon.svg -o public/apple-touch-icon.png
          rsvg-convert -w 512 -h 512 public/hradnik-app-icon.svg -o public/icon-512.png
      - name: Commit generated icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/apple-touch-icon.png public/icon-512.png
          git diff --cached --quiet || git commit -m 'Generate PNG app icons for iOS'
          git push
